<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四象限看板</title>
<meta name="description" content="艾森豪威尔四象限时间管理看板,数据保存在本地浏览器。">
<style>
  :root {
    --bg: #f5f5f4; --panel: #ffffff; --text: #1c1917; --muted: #78716c; --border: #e7e5e4;
    --c1: #dc2626; --c2: #2563eb; --c3: #d97706; --c4: #6b7280;
    --card: #fafaf9; --shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151413; --panel: #1f1d1c; --text: #f5f5f4; --muted: #a8a29e; --border: #33302e;
      --c1: #f87171; --c2: #60a5fa; --c3: #fbbf24; --c4: #9ca3af;
      --card: #292524; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  h1 { font-size: 18px; margin: 0; margin-right: auto; }
  .add { display: flex; gap: 8px; flex: 1 1 360px; max-width: 560px; }
  .add input, .add select {
    font: inherit; color: inherit; background: var(--card);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
  }
  .add input { flex: 1; min-width: 0; }
  button {
    font: inherit; color: inherit; background: var(--card); cursor: pointer;
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px;
  }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .tools { display: flex; gap: 8px; }
  main {
    flex: 1; min-height: 0; padding: 16px;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px;
  }
  .quad {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    border-top: 4px solid var(--c); display: flex; flex-direction: column; min-height: 0;
    box-shadow: var(--shadow);
  }
  .quad.over { outline: 2px dashed var(--c); outline-offset: -4px; }
  .quad h2 { margin: 0; padding: 12px 14px 4px; font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
  .quad h2 small { color: var(--muted); font-weight: 400; font-size: 12px; }
  .quad h2 .count { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 12px; }
  .list { flex: 1; overflow-y: auto; padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
  .task {
    display: flex; align-items: flex-start; gap: 8px; background: var(--card);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; cursor: grab;
  }
  .task.dragging { opacity: .4; }
  .task input[type=checkbox] { margin-top: 4px; accent-color: var(--c); }
  .task .t { flex: 1; word-break: break-word; outline: none; }
  .task.done .t { text-decoration: line-through; color: var(--muted); }
  .task .x { border: none; background: none; padding: 0 4px; color: var(--muted); font-size: 18px; line-height: 1.2; }
  .task .x:hover { color: var(--c1); }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 16px 0; }
  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; grid-template-rows: none; }
    .quad { min-height: 220px; }
    body { height: auto; }
  }
</style>
</head>
<body>
<header>
  <h1>四象限看板</h1>
  <form class="add" id="addForm">
    <input id="newText" placeholder="添加任务,回车确认" autocomplete="off" required>
    <select id="newQuad" aria-label="象限">
      <option value="q1">重要且紧急</option>
      <option value="q2" selected>重要不紧急</option>
      <option value="q3">紧急不重要</option>
      <option value="q4">不重要不紧急</option>
    </select>
    <button class="primary" type="submit">添加</button>
  </form>
  <div class="tools">
    <button id="exportBtn" type="button">导出</button>
    <button id="importBtn" type="button">导入</button>
    <button id="clearDone" type="button">清除已完成</button>
    <input id="importFile" type="file" accept="application/json" hidden>
  </div>
</header>
<main id="board"></main>

<script>
const QUADS = [
  { id: 'q1', title: '重要且紧急', hint: '立刻做', color: 'var(--c1)' },
  { id: 'q2', title: '重要不紧急', hint: '计划做', color: 'var(--c2)' },
  { id: 'q3', title: '紧急不重要', hint: '委派 / 快速处理', color: 'var(--c3)' },
  { id: 'q4', title: '不重要不紧急', hint: '少做 / 删除', color: 'var(--c4)' },
];
const KEY = 'quadrant-board:v1';

let tasks = load();

function load() {
  try {
    const v = JSON.parse(localStorage.getItem(KEY));
    if (Array.isArray(v)) return v;
  } catch (e) {}
  return [];
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {}
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const board = document.getElementById('board');

function render() {
  board.innerHTML = '';
  for (const q of QUADS) {
    const items = tasks.filter(t => t.q === q.id);
    const el = document.createElement('section');
    el.className = 'quad';
    el.dataset.q = q.id;
    el.style.setProperty('--c', q.color);
    const open = items.filter(t => !t.done).length;
    el.innerHTML = `<h2>${q.title}<small>${q.hint}</small><span class="count">${open} 待办</span></h2><div class="list"></div>`;
    const list = el.querySelector('.list');
    if (!items.length) list.innerHTML = '<div class="empty">拖拽任务到这里</div>';
    for (const t of items) list.appendChild(taskEl(t));
    el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
    el.addEventListener('dragleave', () => el.classList.remove('over'));
    el.addEventListener('drop', e => {
      e.preventDefault(); el.classList.remove('over');
      const t = tasks.find(x => x.id === e.dataTransfer.getData('text/plain'));
      if (t && t.q !== q.id) { t.q = q.id; save(); render(); }
    });
    board.appendChild(el);
  }
}

function taskEl(t) {
  const el = document.createElement('div');
  el.className = 'task' + (t.done ? ' done' : '');
  el.draggable = true;
  const cb = document.createElement('input');
  cb.type = 'checkbox'; cb.checked = t.done;
  cb.onchange = () => { t.done = cb.checked; save(); render(); };
  const text = document.createElement('div');
  text.className = 't'; text.textContent = t.text; text.contentEditable = 'plaintext-only';
  text.onblur = () => {
    const v = text.textContent.trim();
    if (!v) { tasks = tasks.filter(x => x !== t); } else { t.text = v; }
    save(); render();
  };
  text.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); text.blur(); } };
  const x = document.createElement('button');
  x.className = 'x'; x.textContent = '×'; x.title = '删除'; x.setAttribute('aria-label', '删除');
  x.onclick = () => { tasks = tasks.filter(v => v !== t); save(); render(); };
  el.append(cb, text, x);
  el.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', t.id);
    e.dataTransfer.effectAllowed = 'move';
    el.classList.add('dragging');
  });
  el.addEventListener('dragend', () => el.classList.remove('dragging'));
  return el;
}

document.getElementById('addForm').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('newText');
  const text = input.value.trim();
  if (!text) return;
  tasks.push({ id: uid(), text, q: document.getElementById('newQuad').value, done: false, created: Date.now() });
  input.value = '';
  save(); render();
});

document.getElementById('clearDone').onclick = () => {
  const n = tasks.filter(t => t.done).length;
  if (n && confirm(`清除 ${n} 个已完成任务?`)) { tasks = tasks.filter(t => !t.done); save(); render(); }
};

document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `quadrant-board-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
};

const importFile = document.getElementById('importFile');
document.getElementById('importBtn').onclick = () => importFile.click();
importFile.onchange = async () => {
  const f = importFile.files[0];
  importFile.value = '';
  if (!f) return;
  try {
    const v = JSON.parse(await f.text());
    if (!Array.isArray(v)) throw 0;
    const ids = new Set(QUADS.map(q => q.id));
    const clean = v.filter(t => t && typeof t.text === 'string' && ids.has(t.q))
      .map(t => ({ id: t.id || uid(), text: t.text, q: t.q, done: !!t.done, created: t.created || Date.now() }));
    if (confirm(`导入 ${clean.length} 个任务,将覆盖当前数据,继续?`)) { tasks = clean; save(); render(); }
  } catch (e) { alert('导入失败:文件格式不正确'); }
};

render();
</script>
</body>
</html>
